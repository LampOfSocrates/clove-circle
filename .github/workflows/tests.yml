name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Case-study calculations + site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Case-study calculation baselines
        run: npm run test:case-studies

      - name: LCA Graph engine and golden models
        run: npm run test:lcagraph

      - name: Full Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
