name: Deploy to GitHub Pages

# Publishes the site only after the test suite (including the case-study
# calculation baselines) passes on the pushed commit.
#
# REQUIRED ONE-TIME SETUP: Settings > Pages > Build and deployment >
# Source = "GitHub Actions". Until that is switched over, Pages keeps
# deploying straight from the branch and this gate does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site, no build step — publish the repo as-is.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
